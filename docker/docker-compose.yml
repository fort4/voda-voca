# 2026-11-02 - voda-voca - 앱 컨테이너 구성: SQLite 파일을 이름 있는 볼륨(/data)에 보관 (2026-11-25 MySQL 제거, ADR-010)
# 파일 위치: docker/docker-compose.yml
# 실행 예시(프로젝트 루트에서): docker compose --project-directory . -f docker/docker-compose.yml up -d
# 모든 민감 설정은 루트의 .env 에서 주입한다 (하드코딩 금지).

services:
  # 앱: 화면(정적 파일)과 API 를 한 프로세스가 같은 출처로 서빙한다. 시작할 때 마이그레이션을 적용한다 (docker-entrypoint.sh).
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: voda-voca:prod
    container_name: voda-voca-app
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      DB_PATH: /data/voca.db
      SECRET_KEY: ${SECRET_KEY:?.env 파일에 SECRET_KEY 를 설정하세요 (cp .env.example .env)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      # DB 파일이 컨테이너를 지워도 남도록 이름 있는 볼륨에 둔다
      - voda-voca-data:/data

volumes:
  voda-voca-data:
    name: voda-voca-data
