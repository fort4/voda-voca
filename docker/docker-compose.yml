# 2026-11-02 - voda-voca - MySQL 8.0 DB + 앱(migrate, app) 컨테이너 구성 (2026-11-25 앱 서비스 추가)
# 파일 위치: docker/docker-compose.yml
# 실행 예시(프로젝트 루트에서): docker compose --project-directory . -f docker/docker-compose.yml up -d
# 모든 민감 설정은 루트의 .env 에서 주입한다 (하드코딩 금지).

services:
  mysql:
    image: mysql:8.0
    container_name: voda-voca-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 마이그레이션: 앱보다 먼저 한 번만 실행하고 끝난다 (시드 적재가 테이블을 필요로 하므로 app 이 이 완료를 기다린다)
  migrate:
    build: &app_build
      context: .
      dockerfile: docker/Dockerfile
      target: prod
    image: voda-voca:prod
    container_name: voda-voca-migrate
    restart: "no"
    command: ["alembic", "-c", "src/backend/alembic.ini", "upgrade", "head"]
    environment: &app_env
      TZ: ${TZ:-Asia/Seoul}
      # 컨테이너 안의 127.0.0.1 은 자기 자신이다. DB 는 서비스 이름(mysql)과 컨테이너 내부 포트(3306)로 찾는다.
      # 호스트용 .env 의 MYSQL_HOST/MYSQL_PORT(127.0.0.1:3307)는 쓰지 않는다. 루트 비밀번호도 앱에 넘기지 않는다.
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:?.env 파일에 MYSQL_DATABASE 를 설정하세요 (cp .env.example .env)}
      MYSQL_USER: ${MYSQL_USER:?.env 파일에 MYSQL_USER 를 설정하세요 (cp .env.example .env)}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?.env 파일에 MYSQL_PASSWORD 를 설정하세요 (cp .env.example .env)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      mysql:
        condition: service_healthy

  # 앱: 화면(정적 파일)과 API 를 한 프로세스가 같은 출처로 서빙한다. 이미지의 HEALTHCHECK(/health)로 상태를 본다.
  app:
    build: *app_build
    image: voda-voca:prod
    container_name: voda-voca-app
    restart: unless-stopped
    environment: *app_env
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  mysql_data:
    name: voda-voca-mysql-data
