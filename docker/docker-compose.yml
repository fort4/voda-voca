# 2026-11-02 - voda-voca - MySQL 8.0 개발용 DB 컨테이너 구성 (utf8mb4, Asia/Seoul)
# 파일 위치: docker/docker-compose.yml
# 실행 예시(프로젝트 루트에서): docker compose --project-directory . -f docker/docker-compose.yml up -d
# 모든 민감 설정은 루트의 .env 에서 주입한다 (하드코딩 금지).

services:
  mysql:
    image: mysql:8.0
    container_name: voda-voca-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
    name: voda-voca-mysql-data
