<!doctype html>
<!--
  2026-11-02 - voda-voca - 프론트엔드 앱 셸: 공통 head, 상단바, 메인 마운트 지점(#app), 모듈 진입점
  파일 위치: src/frontend/index.html
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>보다보카</title>
    <meta name="description" content="모바일에서 편하게 쓰는 웹 단어장 보다보카" />
    <meta name="theme-color" content="#4f46e5" />
    <!-- 파비콘: 별도 파일 없이 인라인 SVG 로 둔다. 이 링크가 있으면 브라우저가 /favicon.ico 를 요청하지 않아 404 가 사라진다 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Cpath d='M12 18h18a6 6 0 0 1 6 6v24a4 4 0 0 0-4-4H12z' fill='%23fff'/%3E%3Cpath d='M52 18H34v26a4 4 0 0 1 4-4h14z' fill='%23fff' fill-opacity='.8'/%3E%3C/svg%3E" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.all.min.js"></script>
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="css/app.css" />
    <!-- 첫 화면이 밝게 번쩍이지 않도록, 테마 클래스는 본문을 그리기 전에 붙인다 (저장값 > 시스템 설정). core/theme.js 와 같은 규칙 -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("voda.theme");
          var dark = stored === "dark" || (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) { /* 저장소나 matchMedia 를 쓸 수 없으면 라이트로 둔다 */ }
      })();
    </script>
  </head>
  <body class="min-h-dvh bg-zinc-50 text-base text-zinc-900 antialiased">
    <header class="app-header sticky top-0 z-30">
      <div class="mx-auto flex h-14 w-full max-w-screen-md items-center justify-between gap-2 px-4">
        <a href="#/wordbooks" class="focus-ring flex min-h-[44px] items-center gap-2 rounded-xl pr-2">
          <span class="brand-mark" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14.5"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M8 7h8"/></svg>
          </span>
          <span class="text-[17px] font-bold tracking-tight text-zinc-900">보다보카</span>
        </a>
        <div class="flex items-center gap-1">
          <button id="sound-toggle" type="button" class="press focus-ring inline-flex h-11 w-11 items-center justify-center rounded-xl text-zinc-600 hover:bg-zinc-100" aria-label="정답 소리 끄기" aria-pressed="true">
            <i data-lucide="volume-2" class="h-5 w-5" aria-hidden="true"></i>
          </button>
          <button id="theme-toggle" type="button" class="press focus-ring inline-flex h-11 w-11 items-center justify-center rounded-xl text-zinc-600 hover:bg-zinc-100" aria-label="다크 모드 전환" aria-pressed="false">
            <i data-lucide="moon" class="h-5 w-5" aria-hidden="true"></i>
          </button>
          <div id="userbar" class="flex items-center gap-1"></div>
        </div>
      </div>
    </header>

    <main id="app" class="mx-auto w-full max-w-screen-md px-4 pb-24 pt-4" aria-live="polite">
      <p class="py-16 text-center text-zinc-500">불러오는 중…</p>
    </main>

    <nav id="tabbar" hidden class="tabbar fixed inset-x-0 bottom-0 z-30" aria-label="주요 메뉴"></nav>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
